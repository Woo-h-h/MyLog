services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mylog
      MYSQL_USER: mylog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mylog}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/mylog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      MYSQL_USER: mylog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mylog}
      JWT_SECRET: ${JWT_SECRET:-mylog-prod-change-this-secret-to-32bytes-min}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-please-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      RESUME_DIR: /app/uploads/resume
    volumes:
      - resume_data:/app/uploads/resume
    ports:
      - "8088:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  resume_data:
